name: Gitleaks

# Server-side secret scan. The local Homebrew gitleaks run can be skipped
# (git commit --no-verify, or simply forgetting); this check cannot.
# Uses the open-source gitleaks CLI directly, so it needs no license key
# (unlike gitleaks-action on organization repos) and runs the same way on
# GitHub and on Forgejo Actions.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"   # pin; bump deliberately (same as brew)
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan every commit, not just the latest snapshot

      - name: Install gitleaks (checksum verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${tarball}"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          ./gitleaks version

      - name: Scan repository history
        # .gitleaksignore at the repo root is picked up automatically.
        # --redact keeps any secret it finds out of the job log.
        run: ./gitleaks git --redact --no-banner --exit-code 1 .
